name: Publish Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish after a manual build
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release --flavor native
      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-native-release.apk wort.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wort-android
          path: wort.apk
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" wort.apk --clobber
          else
            gh release create "$release_tag" wort.apk \
              --generate-notes \
              --title "wort_ $release_tag"
          fi
